<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Conta</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            width: 320px;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #1ed760;
            border: none;
            border-radius: 4px;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #1db954;
        }
        #result {
            margin-top: 15px;
            font-size: 14px;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Consulta de E-mail</h2>
        <input type="email" id="email" placeholder="Digite o e-mail">
        <button onclick="verificarConta()">Verificar</button>
        <div id="result"></div>
    </div>

    <script>
        async function verificarConta() {
            const email = document.getElementById('email').value;
            const resultDiv = document.getElementById('result');

            if (!email) {
                resultDiv.innerText = "Por favor, insira um e-mail.";
                resultDiv.style.color = "#ff4d4d";
                return;
            }

            resultDiv.innerText = "Verificando...";
            resultDiv.style.color = "#ffffff";

            try {
                const response = await fetch('https://default.any-latam.prd.api.hbomax.com/idp/users/accountLookup', {
                    method: 'POST',
                    headers: {
                        'accept': '*/*',
                        'accept-language': 'pt-BR',
                        'content-type': 'application/json',
                        'origin': 'https://auth.hbomax.com',
                        'referer': 'https://auth.hbomax.com/',
                        'x-disco-client': 'WEB:10:hbomax:7.13.0',
                        'x-wbd-preferred-language': 'pt-BR'
                    },
                    body: JSON.stringify({ username: email, flow: "sign_in" })
                });

                if (response.ok) {
                    const data = await response.json();
                    resultDiv.innerText = "Sucesso! Resposta recebida.";
                    resultDiv.style.color = "#1ed760";
                    console.log(data);
                } else {
                    resultDiv.innerText = "Erro na requisição: " + response.status;
                    resultDiv.style.color = "#ff4d4d";
                }
            } catch (error) {
                resultDiv.innerText = "Erro de conexão ou bloqueio de CORS.";
                resultDiv.style.color = "#ff4d4d";
            }
        }
    </script>
</body>
  </html>
